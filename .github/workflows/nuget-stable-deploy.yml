name: Stable release deploy to NuGet

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  verify-aot:
    uses: ./.github/workflows/aot-compatibility.yml

  build-test-package:
    needs: verify-aot
    runs-on: ubuntu-latest

    # Trusted publishing: the push authenticates with an API key nuget.org issues to this workflow
    # for one hour, in exchange of a GitHub OIDC token, instead of with a stored key.
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        
    - name: Setup dotnet
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          9.0.x
          10.0.x

    - name: Build with dotnet
      run: dotnet build --configuration Release

    - name: Run unit tests
      run: dotnet test --configuration Release
      
    - name: Generate nuget package
      run: dotnet pack --configuration Release -o nupkg

    # The issued key lives one hour: request it next to the push that spends it.
    - name: Login to NuGet
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: ${{secrets.NUGET_USER}}

    - name: Push packages
      run: dotnet nuget push './nupkg/*.nupkg' --api-key ${{steps.nuget-login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
